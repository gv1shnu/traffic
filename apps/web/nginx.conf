server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 251m;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 7500s;
  }
  location /health { proxy_pass http://api:8000; }
  location = /docs { proxy_pass http://api:8000; }
  location = /openapi.json { proxy_pass http://api:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
