services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U traffic"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  migrate:
    build: .
    env_file: ${APP_ENV_FILE:-.env}
    volumes: [media:/data, models:/app/models, models:/models]
    command: alembic upgrade head
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    env_file: ${APP_ENV_FILE:-.env}
    volumes: [media:/data, models:/app/models, models:/models]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      retries: 5
    restart: unless-stopped
  worker:
    build: .
    env_file: ${APP_ENV_FILE:-.env}
    volumes: [media:/data, models:/app/models, models:/models]
    command: celery -A apps.worker.tasks.celery worker --loglevel=INFO --concurrency=1
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  scheduler:
    build: .
    env_file: ${APP_ENV_FILE:-.env}
    volumes: [media:/data]
    command: celery -A apps.worker.tasks.celery beat --loglevel=INFO --schedule=/data/celerybeat-schedule
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    build: apps/web
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  media:
  models:
