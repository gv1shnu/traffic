[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-cause-investigator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
 "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
 "redis>=5,<7", "celery>=5.4,<6", "python-multipart>=0.0.20",
 "opencv-python-headless>=4.10,<5", "numpy>=1.26,<3", "langgraph>=1,<2",
 "scikit-learn>=1.6,<2"
]
[project.optional-dependencies]
vision = ["ultralytics>=8.3,<9", "torch>=2.6,<3", "torchvision>=0.21,<1", "easyocr>=1.7,<2", "lap>=0.5"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11", "mypy>=1.15", "types-redis"]
[tool.setuptools.packages.find]
include = ["apps*", "packages*", "fixtures*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations", "apps/web", ".venv"]
